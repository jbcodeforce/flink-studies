# Generated by book-sync init.  Edit by hand; tools never rewrite this file.
# See BOOK_STANDARD.md for the full schema.
schema: 1
name: flink-studies
repo:
  url: https://github.com/jbcodeforce/flink-studies
  branch: master
site_url: https://jbcodeforce.github.io/flink-studies

paths:
  docs: docs
  mkdocs: mkdocs.yml
  index: docs/index.md
  news: docs/news/index.md        # uncomment if you have a news page
  scratch: .context

# First matching prefix wins; unmatched files go to "Other".
sections:
  - title: E2E Demos
    paths: [e2e-demos/]
  - title: Flink SQL
    paths: [code/flink-sql/]
  - title: Table API & Java
    paths: [code/flink-java/, code/table-api/]
  - title: dbt
    paths: [code/dbt/]
  - title: Infrastructure & Deployment
    paths: [deployment/]
  - title: Code & tools
    paths: [code/, tools/, assistants/, .bob/]
  - title: Documentation
    paths: [docs/, mkdocs.yml]


ignore_commits:
  - '^Merge '
  - '(?i)^(typo|wip|fix typo)\b'

stats:
  - id: sql_scripts
    label: SQL scripts
    count: files
    include: ["code/**/*.sql", "e2e-demos/**/*.sql"]
    exclude: ["**/.venv/**", "**/node_modules/**"]
  - id: java_files
    label: Java source files
    count: files
    include: ["code/**/*.java", "e2e-demos/**/*.java"]
    exclude: ["**/.venv/**"]
  - id: e2e_demos
    label: End-to-end demos
    count: dirs
    include: ["e2e-demos/*"]
  - id: sql_studies
    label: Flink SQL studies
    count: dirs
    include: ["code/flink-sql/*"]

versions:
  - id: cp-kafka
    source:
      file: deployment/docker/docker-compose.yaml
      pattern: 'confluentinc/cp-kafka:(\d+\.\d+\.\d+)'
    docs_pattern: 'confluentinc/cp-(?:kafka|schema-registry|control-center|kafka-rest|connect|ksqldb)[^:]*:(\d+\.\d+\.\d+)'
    fix: true
  - id: cp-sql
    source:
      file: code/flink-sql/04-joins/docker-compose.yaml
      pattern: 'confluentinc/cp-kafka:(\d+\.\d+\.\d+)'
    docs_pattern: 'confluentinc/cp-(?:kafka|schema-registry|control-center|kafka-rest|connect|ksqldb)[^:]*:(\d+\.\d+\.\d+)'
    fix: true

# Applied only if the rewritten path exists in the repo.
fix_rules:
  - {match: '^flink-sql/(.+)$',            replace: 'code/flink-sql/\1'}
  - {match: '^my-flink/(.+)$',             replace: 'code/flink-java/my-flink/\1'}
  - {match: '^flink-java/(.+)$',           replace: 'code/flink-java/\1'}
  - {match: '^flink-sql-demos/(.+)$',      replace: 'code/flink-sql/\1'}
  - {match: '^(code/flink-sql/\d+-[a-z-]+-)F(link.*)$', replace: '\1f\2'}
