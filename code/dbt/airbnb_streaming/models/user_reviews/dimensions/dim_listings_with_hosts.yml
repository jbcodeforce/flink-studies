models:
- name: dim_listings_with_hosts
  config:
    contract:
      enforced: false
  columns:
  - name: listing_id
    data_type: varchar(2147483647)
    constraints:
      - type: not_null
      - type: primary_key
        expression: "not enforced"
  - name: listing_name
    data_type: varchar(2147483647)
  - name: room_type
    data_type: varchar(2147483647)
  - name: minimum_nights
    data_type: bigint
  - name: price
    data_type: decimal(10,2)
  - name: host_id
    data_type: varchar(2147483647)
  - name: host_name
    data_type: varchar(2147483647)
  - name: host_is_superhost
    data_type: boolean
  - name: created_at
    data_type: varchar(2147483647)
  - name: updated_at
    data_type: varchar(2147483647)
