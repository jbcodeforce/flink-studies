models:
  - name: dim_date
    description: "Calendar date dimension with season, weekday, and full-moon attributes"
    columns:
      - name: date_id
        description: "Calendar date (PK)"
        data_tests:
          - not_null
          - unique

  - name: dim_listings_cleansed
    description: "Listings dimension"
    columns:
      - name: listing_id
        description: "Listing ID"
        data_tests:
          - not_null
          - unique
      - name: host_id
        description: "Host ID"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      - name: room_type
        description: "Room Type"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Private room', 'Entire home/apt', 'Shared room', 'Hotel room']
      - name: minimum_nights
        description: "Minimum Nights"
        data_tests:
          - not_null

  - name: fct_listing_pricing
    description: "Pricing snapshot per listing with price tier and minimum-stay bucket"
    columns:
      - name: listing_id
        description: "Listing ID (FK)"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id
      - name: price
        description: "Listing price"
        data_tests:
          - not_null

  - name: fct_review_summary
    description: "Monthly review aggregation per listing with sentiment breakdown and full-moon count"
    columns:
      - name: listing_id
        description: "Listing ID (FK)"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id
      - name: review_month
        description: "Month of reviews (first day of month)"
        data_tests:
          - not_null

  - name: fct_host_performance
    description: "Monthly host performance scorecard: listings, sentiment, and revenue proxy"
    columns:
      - name: host_id
        description: "Host ID (FK)"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      - name: review_month
        description: "Month of activity (first day of month)"
        data_tests:
          - not_null

  - name: fct_listing_activity
    description: "Per-listing engagement snapshot: review velocity, recency, and activity status"
    columns:
      - name: listing_id
        description: "Listing ID (PK)"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id
