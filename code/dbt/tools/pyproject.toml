[project]
name = "tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.7.2",
    "cachetools>=7.1.7",
    "confluent-kafka>=2.10.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.50",
    "sqlglot>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["flink_dbt_migrate*"]
